
name: Deploy SvelteSharp Playground

on:
  push:
    branches:
      - main
    paths:
      - 'playground/**'
      - 'compiler/**'
      - '.github/workflows/svelte-sharp-playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Publish .NET WebAssembly compiler
        run: |
          dotnet publish playground/compiler/SvelteSharp.Playground.Compiler.csproj \
            -c Release \
            -r browser-wasm \
            --self-contained true \
            -p:WasmAppBundle=true

      - name: Copy WebAssembly AppBundle
        shell: bash
        run: |
          OUTPUT_DIR="playground/compiler/bin/Release/net9.0/browser-wasm"

          echo "Searching for WebAssembly AppBundle..."

          BUNDLE_DIR=$(find "$OUTPUT_DIR" \
            -type d \
            -name AppBundle \
            -print -quit)

          if [ -z "$BUNDLE_DIR" ]; then
            echo "::error::WebAssembly AppBundle was not generated."
            echo "Available published files:"
            find "$OUTPUT_DIR" -maxdepth 5 -type f | sort | head -200
            exit 1
          fi

          echo "Found AppBundle: $BUNDLE_DIR"

          mkdir -p playground/static/compiler

          cp -a "$BUNDLE_DIR"/. playground/static/compiler/

          echo "Copied compiler files:"
          find playground/static/compiler -maxdepth 3 -type f | sort | head -100

          if [ ! -f playground/static/compiler/main.js ]; then
            echo "::error::main.js is missing from the WebAssembly bundle."
            exit 1
          fi

      - name: Install playground packages
        working-directory: playground
        run: npm ci

      - name: Build playground
        working-directory: playground
        run: npx vite build

      - name: Verify compiler assets in website
        run: |
          echo "Checking generated website..."
          test -f playground/dist/index.html
          find playground/dist/compiler -maxdepth 3 -type f | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
