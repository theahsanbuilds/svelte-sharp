
name: Deploy SvelteSharp Playground

on:
  push:
    branches:
      - main
    paths:
      - 'playground/**'
      - 'compiler/**'
      - '.github/workflows/svelte-sharp-playground.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: playground/package-lock.json

     
      - name: Publish .NET WebAssembly compiler
        run: |
          dotnet --info
          dotnet workload list

          dotnet publish playground/compiler/SvelteSharp.Playground.Compiler.csproj \
            -c Release \
            -r browser-wasm \
            --self-contained true \
            -p:WasmAppDir="${{ github.workspace }}/playground/static/compiler"

      - name: Verify WebAssembly compiler output
        shell: bash
        run: |
          echo "Published compiler files:"
          find playground/static/compiler -maxdepth 3 -type f | sort | head -150

          if [ ! -f playground/static/compiler/_framework/dotnet.js ]; then
            echo "::error::Missing _framework/dotnet.js"
            exit 1
          fi

          if [ ! -f playground/static/compiler/main.js ]; then
            echo "::error::Missing main.js"
            exit 1
          fi

          echo "WebAssembly compiler output verified."


      - name: Install playground packages
        working-directory: playground
        run: npm ci

      - name: Build playground
        working-directory: playground
        run: npx vite build

      - name: Verify compiler assets in website
        run: |
          echo "Checking generated website..."
          test -f playground/dist/index.html
          find playground/dist/compiler -maxdepth 3 -type f | head -100

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
